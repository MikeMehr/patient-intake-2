# MyMD inbox mirror settings. Deployed to /etc/mymd/mail-sync.conf, root:tomcat 0640.
#
# There are DELIBERATELY NO SECRETS IN THIS FILE. The IMAP password comes from
# /var/lib/OscarDocument/oscar/mymd_mail.properties and the database password from
# WEB-INF/classes/oscar_mcmaster.properties - both already owned by tomcat, which is the user
# this service runs as. Nothing to rotate twice.
#
# Every key here is optional; the built-in defaults in mymd_mail_sync.py match these values.

# Where the credentials come from.
mail.properties=/var/lib/OscarDocument/oscar/mymd_mail.properties
oscar.properties=/opt/tomcat9/webapps/oscar/WEB-INF/classes/oscar_mcmaster.properties

# Blank means "use mail.host from mymd_mail.properties", which is the cPanel Dovecot server
# the mailbox actually lives on. Note that imap.secureserver.net is a DIFFERENT GoDaddy mail
# platform and is not this mailbox - do not point at it.
imap.host=
imap.port=993
imap.timeout=30

# Verified live 2026-08-09 with a LIST: the hierarchy delimiter is "." and the folders are
# INBOX, INBOX.Archive, INBOX.spam, INBOX.Junk, INBOX.Trash, INBOX.Sent, INBOX.Drafts.
# INBOX.Sent is mirrored so replies sent straight from Roundcube still appear in the chart
# thread instead of leaving a one-sided conversation.
folders=INBOX,INBOX.Sent
outbound.folders=INBOX.Sent

storage.root=/var/lib/OscarDocument/oscar/mymd_inbox

db.host=127.0.0.1
db.port=3306
db.name=oscar_db

# 25 MB per attachment; anything larger is recorded with no file so the UI can say "too
# large, open it in webmail" rather than pretending it never existed.
max.attachment.bytes=26214400
max.run.attachment.bytes=209715200

# Consecutive IMAP auth failures before the poller stops connecting entirely. Guards against
# getting the clinic's IP banned by cPHulk, which would take out Roundcube too. Clear with
# `mymd_mail_sync.py --reset-errors` after fixing the password.
auth.failure.limit=3

<script language="javascript" type="text/javascript">
	/****************************
	startup functions
	****************************/
	function startUp()
	{
		// shows the form on a development machine straight from the file system -
		// saves uploading to the server just to check field alignments
		var strLoc = window.location.href.toLowerCase();
		if(strLoc.indexOf("https") == -1)
		{
			var src = document.getElementById('BGImage').src;
			document.getElementById('BGImage').src = src.replace('$%7Boscar_image_path%7D','');
		}
		document.title = 'Thrombosis Clinic Referral - ' + document.getElementById('NameLast').value;
		setDefaults();
	}

	// yyyy-mm-dd (the today / dob AP tags) to the DD/MM/YYYY the form asks for
	function toDDMMYYYY(s)
	{
		var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
		return m ? (m[3] + '/' + m[2] + '/' + m[1]) : s;
	}

	function setDefaults()
	{
		// only on the very first load of a new form - a saved copy keeps its answers
		if (document.getElementById("newForm").value == 'True')
		{
			document.getElementById('DateOfBirth').value = toDDMMYYYY(document.getElementById('DOBRaw').value);
			document.getElementById('RefDate').value = toDDMMYYYY(document.getElementById('TodayRaw').value);
			var sx = String(document.getElementById('PatientSexRaw').value).toUpperCase().charAt(0);
			if (sx == 'F') document.getElementById('SexFemale').value = 'X';
			if (sx == 'M') document.getElementById('SexMale').value = 'X';
			// the clinic accepts exactly one service, the reason the form is opened at all
			document.getElementById('ServiceVTE').value = 'X';
			if (document.getElementsByName('subject')[0].value == '')
				document.getElementsByName('subject')[0].value = 'Thrombosis Clinic Referral';
			fillSignature();
		}
	}

	// The Signature line carries the same signature the prescriptions do:
	// providerExt.signature for the logged-in provider, served by
	// eform/currentUserSignature.jsp (blank providerExt.signature blanks it there
	// AND here). Async fill on new forms only - a saved copy keeps what was signed,
	// and a fetch failure (endpoint wiped by a WAR redeploy) just leaves the line
	// blank for a hand signature.
	function fillSignature()
	{
		var sigEl = document.getElementById('Signature');
		if (!sigEl || sigEl.value != '') { return; }
		fetch(window.location.pathname.replace(/[^\/]*$/, "") + "currentUserSignature.jsp", { credentials: "same-origin" })
			.then(function (r) { return r.ok ? r.text() : ""; })
			.then(function (t) {
				t = String(t).replace(/^\s+|\s+$/g, "");
				if (t && t.length < 80 && sigEl.value == '') { sigEl.value = t; }
			})
			.catch(function (e) {});
	}

	/****************************
	submit and print functions
	****************************/
	function printSubmit()
	{
		printLetter();
		releaseDirtyFlag();
		submission();
	}

	function printLetter()
	{
		if (document.getElementById('BottomButtons').style.display == '')
			document.getElementById('BottomButtons').style.display = 'none';
		window.print();
	}

	function submission()
	{
		setFlag();
		setTimeout('document.ThrombosisReferralForm.submit()',1000);
	}

	function setFlag()
	{
		if (document.getElementById("newForm").value == 'True')
			document.getElementById("newForm").value = 'False';
	}

	function showButtons()
	{
		if (document.getElementById('BottomButtons').style.display == 'none')
			document.getElementById('BottomButtons').style.display = '';
	}

	function closeReqForm()
	{
		try { releaseDirtyFlag(); } catch (e) {}
		window.close();
	}

	/****************************
	checkbox functions
	****************************/
	function changeValue(x)
	{
		if (document.getElementById(x).value == '')
			document.getElementById(x).value = 'X';
		else
			document.getElementById(x).value = '';
	}

	function displayKeyCode(evt,x)
	{
		var charCode = (evt.which) ? evt.which : event.keyCode
		if (charCode != 9)
		{
			changeValue(x);
			return false;
		}
	}
</script>

<script type="text/javascript">
	// --- shared by the chart / email / fax buttons below ------------------------
	function _reqTarget() {
		function _qp(src, n) { var m = String(src).match(new RegExp("[?&]" + n + "=([^&]*)")); return m ? decodeURIComponent(m[1]) : ""; }
		// On the add page the form keeps its own name; once saved OSCAR renames it to
		// saveEForm. The saved view (efmshowform_data.jsp?fdid=N) has no query string,
		// but OSCAR always rewrites the form action to addEForm.do?efmfid=..&efmdemographic_no=..
		var f = document.ThrombosisReferralForm || document.saveEForm || document.getElementById("ThrombosisReferralForm");
		if (!f) { alert("Cannot find this form on the page."); return null; }
		var demo = _qp(window.location.search, "demographic_no") || _qp(f.action, "efmdemographic_no");
		var theFid = _qp(window.location.search, "fid") || _qp(f.action, "efmfid");
		if (!demo || !theFid) { alert("Cannot tell which patient or form this is - open the form from the chart and try again."); return null; }
		return { f: f, demo: demo, fid: theFid };
	}

	var REQ_FILED = false;               // one of these buttons has already filed a copy

	// Saves the referral in a hidden iframe, then calls the endpoint once the
	// save has landed - only then is there a stored copy to render.
	function _saveThen(t, btn, busyLabel, idleLabel, frameId, buildUrl) {
		function restore() { if (btn) { btn.disabled = false; btn.value = idleLabel; } }
		function send() {
			fetch(buildUrl(t), { credentials: "same-origin" })
				.then(function (r) { return r.text(); })
				.then(function (txt) { alert(txt); restore(); })
				.catch(function (e) { restore(); alert("Failed: " + e); });
		}
		if (btn) { btn.disabled = true; btn.value = busyLabel; }

		// Already filed and nothing typed since? Send the copy already in the chart,
		// so faxing twice leaves ONE referral in the eForm list. needToConfirm is
		// OSCAR's own dirty flag, set on keypress and cleared by releaseDirtyFlag().
		var dirty = true;
		try { dirty = (typeof needToConfirm === "undefined") || needToConfirm; } catch (e) {}
		if (REQ_FILED && !dirty) { send(); return; }
		var ifr = document.getElementById(frameId);
		if (!ifr) {
			ifr = document.createElement("iframe");
			ifr.name = frameId; ifr.id = frameId; ifr.style.display = "none";
			document.body.appendChild(ifr);
		}
		var prevTarget = t.f.target;
		var submitted = false, done = false;
		var timer = setTimeout(function () {
			if (done) { return; }
			done = true; restore();
			alert("The form did not finish saving, so nothing was sent. Try again.");
		}, 20000);
		ifr.onload = function () {
			if (!submitted || done) { return; }
			done = true;
			clearTimeout(timer);
			t.f.target = prevTarget;
			REQ_FILED = true;
			send();
		};
		try { setFlag(); } catch (e) {}
		try { releaseDirtyFlag(); } catch (e) {}
		t.f.target = frameId;
		submitted = true;
		t.f.submit();
	}

	function saveReqToChart() {
		var t = _reqTarget();
		if (!t) { return; }
		_saveThen(t, document.getElementById("SaveChartButton"), "Saving...", "Save to chart", "chartSaveFrame",
			function (t2) {
				return window.location.origin + window.location.pathname.replace(/[^\/]*$/, "") + "saveEformToChart.jsp"
					+ "?demographicNo=" + encodeURIComponent(t2.demo) + "&fid=" + encodeURIComponent(t2.fid);
			});
	}

	function emailReqToPatient() {
		var t = _reqTarget();
		if (!t) { return; }
		if (!confirm("Save this referral and email a copy to the patient?\n\nThe PDF opens with the patient PHN as the password.")) { return; }
		_saveThen(t, document.getElementById("EmailButton"), "Sending...", "Email to Patient", "emailSaveFrame",
			function (t2) {
				return window.location.origin + window.location.pathname.replace(/[^\/]*$/, "") + "emailEformToPatient.jsp"
					+ "?demographicNo=" + encodeURIComponent(t2.demo) + "&fid=" + encodeURIComponent(t2.fid);
			});
	}

	// --- the shared fax address book, the one fax/newFax.jsp uses ---------------
	var FAX_BOOK = null;                 // fetched once, on first use

	function faxBookOpen() {
		if (FAX_BOOK) { faxBookRender(); return; }
		var panel = document.getElementById("fax_results");
		panel.innerHTML = "<div style=\"padding:6px; color:#666;\">Loading the address book...</div>";
		panel.style.display = "block";
		fetch("../fax/faxAddressBook.jsp", { credentials: "same-origin" })
			.then(function (r) { return r.json(); })
			.then(function (rows) { FAX_BOOK = rows || []; faxBookRender(); })
			.catch(function () {
				FAX_BOOK = [];
				panel.innerHTML = "<div style=\"padding:6px; color:#900;\">Could not load the address book - type the fax number instead.</div>";
			});
	}

	function faxBookClose() { document.getElementById("fax_results").style.display = "none"; }

	function faxBookRender() {
		var q = (document.getElementById("fax_search").value || "").toLowerCase().replace(/\s+/g, " ").trim();
		var panel = document.getElementById("fax_results");
		panel.style.display = "block";
		var hits = [];
		for (var i = 0; i < FAX_BOOK.length && hits.length < 60; i++) {
			var c = FAX_BOOK[i];
			if (!q || (c.n + " " + c.g + " " + c.f).toLowerCase().indexOf(q) >= 0) { hits.push(c); }
		}
		if (!hits.length) {
			panel.innerHTML = "<div style=\"padding:6px; color:#666;\">No contact matches that.</div>";
			return;
		}
		var html = "", lastGroup = null;
		for (var k = 0; k < hits.length; k++) {
			var h = hits[k];
			if (h.g !== lastGroup) {
				html += '<div style="padding:3px 6px; font-weight:bold; background:#eef2f7;">'
					+ faxEsc(h.g) + '</div>';
				lastGroup = h.g;
			}
			html += '<div style="padding:3px 6px 3px 18px; cursor:pointer;"'
				+ ' onmouseover="this.style.background=\'#dce9f7\'"'
				+ ' onmouseout="this.style.background=\'\'"'
				+ ' onclick="faxBookPick(\'' + faxEsc(h.f) + '\', \'' + faxEsc(h.n).replace(/'/g, "&#39;") + '\')">'
				+ faxEsc(h.n) + ' <span style="color:#666;">' + faxEsc(h.f) + '</span></div>';
		}
		panel.innerHTML = html;
	}

	function faxEsc(s) {
		return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
			.replace(/>/g, "&gt;").replace(/"/g, "&quot;");
	}

	function faxBookPick(num, name) {
		document.getElementById("fax_number").value = num;
		document.getElementById("fax_chosen").innerHTML = faxEsc(name);
		document.getElementById("fax_search").value = name;
		faxBookClose();
	}

	function faxReferral() {
		var box = document.getElementById("fax_number");
		var dest = box ? box.value.replace(/[^0-9]/g, "") : "";
		if (dest.length == 11 && dest.charAt(0) == "1") { dest = dest.substring(1); }
		if (dest.length != 10) {
			alert("Pick a contact from the address book, or type a full 10-digit fax number."); return;
		}
		var chosen = document.getElementById("fax_chosen");
		var destLabel = (chosen && chosen.textContent ? chosen.textContent + " (" + dest + ")" : dest);
		var t = _reqTarget();
		if (!t) { return; }
		if (!confirm("Save this referral and fax it to " + destLabel + "?")) { return; }
		_saveThen(t, document.getElementById("FaxButton"), "Faxing...", "Fax", "faxSaveFrame",
			function (t2) {
				return window.location.origin + window.location.pathname.replace(/[^\/]*$/, "") + "faxEformReq.jsp"
					+ "?demographicNo=" + encodeURIComponent(t2.demo) + "&fid=" + encodeURIComponent(t2.fid)
					+ "&faxNumber=" + encodeURIComponent(dest) + "&saveToChart=1";
			});
	}
</script>

<!-- MyMD Aug2026: apply the ha_prefill fill-spec from the Health Assist transcription page -->
<script type="text/javascript">
	function haPrefill() {
		function _qp(src, n) { var m = String(src).match(new RegExp("[?&]" + n + "=([^&]*)")); return m ? decodeURIComponent(m[1]) : ""; }
		var raw = _qp(window.location.search, "ha_prefill");
		if (!raw || raw.length > 8192) { return; }
		var spec;
		try {
			var b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
			while (b64.length % 4) { b64 += "="; }
			spec = JSON.parse(decodeURIComponent(escape(atob(b64))));
		} catch (e) { return; }
		if (!spec || spec.v !== 1) { return; }

		// Wrong-patient guard: the spec was built for one demographic.
		var demo = _qp(window.location.search, "demographic_no");
		if (!demo) {
			var forms = document.getElementsByTagName("form");
			for (var i = 0; i < forms.length && !demo; i++) { demo = _qp(forms[i].action, "efmdemographic_no"); }
		}
		if (!demo || String(spec.demographicNo) !== String(demo)) {
			alert("This prefilled referral was prepared for a different patient - leaving the form blank.");
			return;
		}

		function el(id) {
			var e = document.getElementById(id);
			if (!e) { var byName = document.getElementsByName(id); e = byName.length ? byName[0] : null; }
			return e;
		}

		var checks = spec.checks || [];
		for (var c = 0; c < checks.length; c++) {
			var box = el(String(checks[c]));
			if (!box) { continue; }
			if (String(box.type).toLowerCase() === "checkbox") { box.checked = true; }
			else { box.value = "X"; }
		}
		var fields = spec.fields || {};
		for (var name in fields) {
			if (!Object.prototype.hasOwnProperty.call(fields, name)) { continue; }
			var value = String(fields[name]);
			var input = el(String(name));
			if (!input || !("value" in input)) { continue; }
			// oscarDB= substitution may already have filled something - append, never clobber.
			if (String(input.value).replace(/^\s+|\s+$/g, "") === "") { input.value = value; }
			else { input.value += (String(input.tagName).toLowerCase() === "textarea" ? "\n" : "; ") + value; }
		}

		try { setFlag(); } catch (e) {}
		try { setDirtyFlag(); } catch (e) {}
	}
	// load, not DOMContentLoaded: the form's own startup scripts run first and
	// cannot overwrite what this fills in afterwards.
	if (window.addEventListener) { window.addEventListener("load", haPrefill, false); }
	else if (window.attachEvent) { window.attachEvent("onload", haPrefill); }
</script>
